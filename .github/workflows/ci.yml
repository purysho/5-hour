name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job needing more declares it locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/driftless_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driftless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # ADR-0003 makes the adversarial corpus a blocking gate. It runs inside
      # the suite below; it is called out here so that anyone tempted to add
      # `continue-on-error` to get a build green sees why they must not.
      #
      # Coverage thresholds are enforced in vitest.config.ts. Lower them and
      # this step fails, which is the intent — a threshold that can be edited
      # to make a build pass is not a threshold.
      - name: Test
        run: pnpm test:coverage

  # Our own dependencies. A product that keeps other people's dependencies
  # current has no standing to be careless with its own (ADR-0008).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
