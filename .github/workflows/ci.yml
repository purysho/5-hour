name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. A job needing more declares it locally.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Passwordless, to match how the suite connects. `test/db/setup.ts` derives two
# non-superuser roles from this URL and clears the password, because those roles
# are created without one — running the suite as a superuser would bypass RLS and
# turn every isolation assertion into a tautology (ADR-0004, ADR-0005).
env:
  DATABASE_URL: postgresql://postgres@localhost:5432/driftless_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          # Trust auth, so the two passwordless login roles the suite creates can
          # connect over TCP. Under the default scram-sha-256 they cannot, which
          # is what kept this job red. Safe here and nowhere else: the container
          # is ephemeral, reachable only from this job's network, and holds
          # nothing but throwaway fixtures.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: driftless_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm lint` existed but no job ran it, so the only thing enforcing it was
      # somebody remembering to. Gated here for the same reason as the rest.
      - name: Lint
        run: pnpm lint

      # ADR-0003 makes the adversarial corpus a blocking gate. It runs inside
      # the suite below; it is called out here so that anyone tempted to add
      # `continue-on-error` to get a build green sees why they must not.
      #
      # Coverage thresholds are enforced in vitest.config.ts. Lower them and
      # this step fails, which is the intent — a threshold that can be edited
      # to make a build pass is not a threshold.
      - name: Test
        run: pnpm test:coverage

  # Our own dependencies. A product that keeps other people's dependencies
  # current has no standing to be careless with its own (ADR-0008).
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
